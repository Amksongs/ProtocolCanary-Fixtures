name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned to an exact patch version so every CI run validates against
          # the same interpreter. Minor-only pinning ("3.11") would float to
          # whatever the newest 3.11.x is at run time, changing the validation
          # target without any commit in this repository. Bump this
          # deliberately when a new patch release is wanted.
          python-version: "3.11.16"

      - name: Structural fixture validation
        run: python3 tools/validate/validate.py

      - name: Repository tests
        run: python3 -m unittest discover tests -v
