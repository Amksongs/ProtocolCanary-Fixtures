name: release-pack

on:
  push:
    tags:
      - "protocol-*"
      - "v*"
  workflow_dispatch:
    inputs:
      pack:
        description: "Pack directory to release (e.g. protocol-28)"
        required: true
        default: "protocol-28"
      version:
        description: "Release version (MAJOR.MINOR.PATCH)"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Determine release parameters
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pack=${{ inputs.pack }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              echo "pack=protocol-28" >> "$GITHUB_OUTPUT"
            elif [[ "$TAG" =~ ^protocol-([0-9]+)$ ]]; then
              echo "pack=$TAG" >> "$GITHUB_OUTPUT"
              echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            else
              echo "Unexpected release tag: $TAG" >&2
              exit 1
            fi
          fi

      - name: Build pack archive (Pass 1)
        run: |
          mkdir -p /tmp/build1
          python3 tools/pack/pack.py "${{ steps.meta.outputs.pack }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --output-dir /tmp/build1

      - name: Build pack archive (Pass 2)
        run: |
          mkdir -p /tmp/build2
          python3 tools/pack/pack.py "${{ steps.meta.outputs.pack }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --output-dir /tmp/build2

      - name: Assert bit-for-bit identical builds
        run: |
          ARCHIVE="protocolcanary-fixtures-${{ steps.meta.outputs.version }}.tar.gz"
          cmp /tmp/build1/"$ARCHIVE" /tmp/build2/"$ARCHIVE"
          echo "Reproducible build comparison passed: bit-for-bit identical output."

      - name: Generate and verify release manifest
        run: |
          mkdir -p dist
          ARCHIVE="protocolcanary-fixtures-${{ steps.meta.outputs.version }}.tar.gz"
          cp /tmp/build1/"$ARCHIVE" dist/
          python3 tools/pack/verify_archive.py dist/"$ARCHIVE"
          python3 tools/release/manifest.py dist/"$ARCHIVE" \
            --revision "${{ github.sha }}" \
            --output dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.manifest.json \
            --sha256-file dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.sha256
          python3 tools/pack/verify_archive.py dist/"$ARCHIVE" \
            --manifest dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.tar.gz
            dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.manifest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.tar.gz \
            dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.manifest.json \
            dist/protocolcanary-fixtures-${{ steps.meta.outputs.version }}.sha256 \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes
